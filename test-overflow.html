<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0}iframe{width:390px;height:800px;border:0}</style></head>
<body><script>
localStorage.clear();
localStorage.setItem('rambuy.theme', 'light');
const f = document.createElement('iframe');
f.src = '/#/';
document.body.appendChild(f);
setTimeout(() => {
  const d = f.contentDocument;
  const vw = f.contentWindow.innerWidth;
  const wide = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > vw + 2 && r.width > 50 && !['HTML','BODY'].includes(el.tagName)) {
      wide.push(el.tagName + '.' + (el.className && el.className.split ? el.className.split(' ')[0] : '') + ':' + Math.round(r.width) + '@' + Math.round(r.right));
    }
  });
  document.title = 'VW:' + vw + '_SCROLLW:' + d.documentElement.scrollWidth + '_WIDE:' + wide.slice(0, 6).join('|');
}, 1500);
</script></body></html>
